name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            artifact: windows-amd64
            binary: mod.dll
          - os: ubuntu-latest
            platform: linux-amd64
            artifact: linux-amd64
            binary: mod.so
          - os: macos-14
            platform: macos-arm64
            artifact: macos-arm64
            binary: mod.dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release

      - name: Stage platform artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifact/lib/${{ matrix.platform }}"
          cp mod.json artifact/mod.json

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/mod.dll "artifact/lib/${{ matrix.platform }}/mod.dll"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build/mod.dylib "artifact/lib/${{ matrix.platform }}/mod.dylib"
          else
            cp build/mod.so "artifact/lib/${{ matrix.platform }}/mod.so"
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0

  package:
    name: All-platforms and Foxhollow bundles
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: downloaded/windows-amd64

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: downloaded/linux-amd64

      - name: Download macOS Apple Silicon build
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: downloaded/macos-arm64

      - name: Assemble combined package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/sfa-developer-console/lib/windows-amd64
          mkdir -p package/sfa-developer-console/lib/linux-amd64
          mkdir -p package/sfa-developer-console/lib/macos-arm64

          cp mod.json package/sfa-developer-console/mod.json
          cp downloaded/windows-amd64/lib/windows-amd64/mod.dll package/sfa-developer-console/lib/windows-amd64/mod.dll
          cp downloaded/linux-amd64/lib/linux-amd64/mod.so package/sfa-developer-console/lib/linux-amd64/mod.so
          cp downloaded/macos-arm64/lib/macos-arm64/mod.dylib package/sfa-developer-console/lib/macos-arm64/mod.dylib

          test -f package/sfa-developer-console/mod.json
          test -f package/sfa-developer-console/lib/windows-amd64/mod.dll
          test -f package/sfa-developer-console/lib/linux-amd64/mod.so
          test -f package/sfa-developer-console/lib/macos-arm64/mod.dylib

          find package/sfa-developer-console -maxdepth 4 -type f -print

      - name: Create all-platforms GitHub ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package
          cmake -E tar cfv ../sfa-developer-console-0.3.4.zip --format=zip sfa-developer-console
          cd ..
          test -f sfa-developer-console-0.3.4.zip

      - name: Create Foxhollow .fox bundle
        shell: bash
        run: |
          set -euo pipefail
          cd package/sfa-developer-console
          cmake -E tar cfv ../../sfa-developer-console-0.3.4.fox --format=zip mod.json lib
          cd ../..
          test -f sfa-developer-console-0.3.4.fox

      - name: Upload all-platforms GitHub ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sfa-developer-console-0.3.4-all-platforms
          path: sfa-developer-console-0.3.4.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Foxhollow .fox bundle
        uses: actions/upload-artifact@v4
        with:
          name: sfa-developer-console-0.3.4-fox-bundle
          path: sfa-developer-console-0.3.4.fox
          if-no-files-found: error
          compression-level: 0

      - name: Attach packages to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sfa-developer-console-0.3.4.zip
            sfa-developer-console-0.3.4.fox
